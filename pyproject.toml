[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "online-knowledge"
version = "0.1.0"
description = "FastAPI service for online knowledge extraction"
requires-python = ">= 3.11"
dependencies = [
    "fastapi >= 0.115",
    "uvicorn[standard] >= 0.32",
    "pydantic-settings >= 2.6",
    "trafilatura",
    "llama-index-core",
    "llama-index-embeddings-huggingface",
    "llama-index-retrievers-bm25",
    "elasticsearch >= 8.13, < 9",
]

[tool.uv.sources]
trafilatura = { path = "sources/trafilatura", editable = true }
llama-index-core = { path = "sources/llama_index/llama-index-core", editable = true }
llama-index-retrievers-bm25 = { path = "sources/llama_index/llama-index-integrations/retrievers/llama-index-retrievers-bm25", editable = true }

[tool.setuptools.packages.find]
include = ["app*"]
